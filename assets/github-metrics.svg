<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-labelledby="title desc">
  <title id="title">GitHub metrics are initializing</title>
  <desc id="desc">Run the Refresh profile assets workflow to replace this card with live GitHub metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="178" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="84" cy="90" r="42" fill="none" stroke="#21262d" stroke-width="8"/>
  <path d="M84 48A42 42 0 0 1 124 102" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <text x="150" y="78" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Live GitHub metrics initializing</text>
  <text x="150" y="111" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Run “Refresh profile assets” once after publishing this repository.</text>
